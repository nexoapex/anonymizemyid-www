# Netlify build settings for the Anonymize my ID website (Hugo).
# Import this repo on Netlify (Add new site → Import from GitHub) — these
# settings are picked up automatically; then point the custom domain at it.

[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  # Keep in step with the local toolchain, so what gets tested is what deploys.
  HUGO_VERSION = "0.164.0"
  TZ = "Europe/Madrid"

# English lives at the root (defaultContentLanguageInSubdir = false), but Hugo
# still writes an /en/ alias — a meta-refresh HTML stub. Search engines treat
# those as soft redirects and spend crawl budget rendering them; a real 301 is
# both faster for visitors and unambiguous for crawlers.
#
# Deliberately the exact path, NOT /en/*: the only other file Hugo puts under
# /en/ is /en/sitemap.xml, which is the real English sitemap that the sitemap
# index points at. A wildcard here would 301 it to the index and English URLs
# would stop being discoverable through the sitemap altogether.
[[redirects]]
  from = "/en/"
  to = "/"
  status = 301
  force = true

# Spanish guides moved from the English slug to a Spanish one (round 6).
# Keep these: they carry the equity of every /es/ URL indexed before the move,
