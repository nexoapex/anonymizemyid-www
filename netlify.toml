# Netlify build settings for the Anonymize my ID website (Hugo).
# Import this repo on Netlify (Add new site → Import from GitHub) — these
# settings are picked up automatically; then point the custom domain at it.

[build]
  publish = "public"
  command = "hugo --gc --minify"

[build.environment]
  HUGO_VERSION = "0.163.2"
  TZ = "Europe/Madrid"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Apex-only (no includeSubDomains/preload — no subdomains exist yet; adding
    # either later is a one-way door and should be a deliberate call, not a
    # side effect of an SEO pass).
    Strict-Transport-Security = "max-age=31536000"
    # Hash-based (not nonce-based: Netlify headers are static, and every inline
    # <script>/<style> on this site is byte-identical on every page, verified
    # across languages/sections before shipping). 'unsafe-inline' is a no-op
    # fallback for pre-CSP2 browsers only — modern browsers ignore it once a
    # hash is present. Recompute the hashes and update this line if
    # main.css or either inline <script> in partials/head.html /
    # partials/analytics.html ever changes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'sha256-GfHaa5x6i8YzncHV+t2ig3YfhnmcxF2Rx5+5ybMi/IM=' 'sha256-C5A1trwm6aJ0EGplab/vC0ApSiDOEJzeDoc6aWqcN8w=' 'unsafe-inline'; style-src 'self' 'sha256-klfpaOJkeAeYgLUWZKtBg8iy8hRSVgvF3WJjbNlle6M=' 'unsafe-inline'; img-src 'self' https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Long-cache the fingerprinted / stable image + icon assets.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# Serve the web app manifest with the correct content type.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
