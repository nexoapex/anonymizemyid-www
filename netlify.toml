[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Deny by default the powerful features this site never uses. The app does
    # the camera work on the device, not in the browser — nothing here needs it.
    Permissions-Policy = "accelerometer=(), autoplay=(), camera=(), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), midi=(), payment=(), usb=()"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Apex-only (no includeSubDomains/preload — no subdomains exist yet; adding
    # either later is a one-way door and should be a deliberate call, not a
    # side effect of an SEO pass).
    Strict-Transport-Security = "max-age=31536000"
    # Hash-based (not nonce-based: Netlify headers are static, and the one
    # remaining inline <script> (the language-redirect in partials/head.html)
    # and the one inline <style> (main.css, inlined for FCP) are byte-identical
    # on every page, verified across languages/sections before shipping).
    # Google Analytics is no longer statically embedded anywhere — it's only
    # ever injected client-side by assets/js/consent.js, and only after the
    # visitor accepts the cookie banner (partials/cookie-consent.html); that's
    # why googletagmanager.com/google-analytics.com stay allow-listed even
    # though nothing loads them until then. 'unsafe-inline' is a no-op
    # fallback for pre-CSP2 browsers only — modern browsers ignore it once a
    # hash is present. Recompute the hashes and update this line if main.css
    # or the inline <script> in partials/head.html ever changes.
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://www.googletagmanager.com 'sha256-GfHaa5x6i8YzncHV+t2ig3YfhnmcxF2Rx5+5ybMi/IM=' 'unsafe-inline'; style-src 'self' 'sha256-h0/bT2Vg0XyJIktrTVLJt70MXcO297LTzZ3PUShIGak=' 'unsafe-inline'; img-src 'self' https://www.google-analytics.com https://*.google-analytics.com; connect-src 'self' https://www.google-analytics.com https://*.google-analytics.com https://*.analytics.google.com; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'; upgrade-insecure-requests"

# Long-cache the fingerprinted / stable image + icon assets.
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Hugo fingerprints the JS bundle (consent.min.<sha256>.js) and the tag carries
# a matching SRI hash, so the bytes behind this URL can never change — editing
# consent.js produces a different filename. Netlify's default of
# "max-age=0, must-revalidate" therefore bought a conditional request on every
# page view in exchange for nothing. `immutable` is only safe *because* of the
# fingerprint: never widen this to an unhashed path.
[[headers]]
  for = "/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# RSL 1.0 licensing terms at the protocol level, so a crawler that fetches an
# asset without ever reading robots.txt or the HTML still sees them.
[[headers]]
  for = "/*"
  [headers.values]
    Link = '<https://anonymizemyid.com/license.xml>; rel="license"; type="application/rsl+xml"'

# The RSL document itself needs its registered media type, which Netlify does
# not know about.
[[headers]]
  for = "/license.xml"
  [headers.values]
    Content-Type = "application/rsl+xml; charset=utf-8"

[[headers]]
  for = "/es/license.xml"
  [headers.values]
    Content-Type = "application/rsl+xml; charset=utf-8"

# Serve the web app manifest with the correct content type.
[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
