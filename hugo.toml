# ─────────────────────────────  German  ───────────────────────────────
# Aimed at the whole DACH market, not just Germany: the guides carry the
# Austrian and Swiss position alongside the German one wherever the law
# differs, and `hreflangAlso` (below) declares de-AT / de-CH alternates so a
# search in Vienna or Zurich resolves to this edition rather than the English
# one. There is a single German edition — one URL per page, three targets.
[languages.de]
  locale = "de-DE"
  label = "Deutsch"
  title = "Anonymize my ID — Ausweis teilen, Identität schützen"
  weight = 3
  # The section itself is renamed for German: /de/ratgeber/ rather than
  # /de/guides/. "Ratgeber" is the word German search actually uses for this
  # kind of hub, and it is the one segment every guide URL inherits.
  [languages.de.permalinks]
    [languages.de.permalinks.page]
      guides = "/ratgeber/:slug/"
    [languages.de.permalinks.section]
      guides = "/ratgeber/"
  [languages.de.params]
    tagline = "Teilen Sie Ihren Ausweis, nicht Ihre Identität."
    description = "Personalausweis oder Reisepass fotografieren und eine sichere, geschwärzte Kopie mit Wasserzeichen erstellen — 100 % auf dem Handy, ohne Upload."
    price = "≈ 4 €"
    priceNote = "einmalig · für immer"
    priceDisclaimer = "ca. — zzgl. MwSt., je nach Region"
    ogImageAlt = "Anonymize my ID — ein fotografierter Reisepass, direkt auf dem Gerät geschwärzt und mit Wasserzeichen versehen"
    # Extra hreflang targets that resolve to this same German edition. Germany
    # is covered by the plain `de` alternate; these two add Austria and
    # Switzerland explicitly.
    hreflangAlso = ["de-AT", "de-CH"]
  [languages.de.menus]
    [[languages.de.menus.footer]]
      name = "Ratgeber"
      pageRef = "/guides"
      weight = 5
    [[languages.de.menus.footer]]
      name = "Datenschutzerklärung"
      pageRef = "/privacy"
      weight = 10
    [[languages.de.menus.footer]]
      name = "Nutzungsbedingungen"
      pageRef = "/terms"
      weight = 20
    [[languages.de.menus.footer]]
      name = "Impressum"
      pageRef = "/imprint"
      weight = 30
    [[languages.de.menus.footer]]
      name = "Über uns"
      pageRef = "/about"
      weight = 40
    [[languages.de.menus.footer]]
      name = "Kontakt"
      pageRef = "/contact"
      weight = 50

# ───────────────────────  Shared params (all languages)  ───────────────
[params]
  googleAnalytics = "G-524LZY9KB9"
  appName = "Anonymize my ID"
  freeUses = 2
  # A store badge goes live as soon as its URL is set; leave "#" to keep "Coming soon".
  # The country-less App Store link 301-redirects each visitor to their own
  # storefront (e.g. /us/, /es/), which is what we want for a travel audience.
  appStoreUrl = "https://apps.apple.com/app/id6781656126"
  appStoreId = "6781656126"
  playStoreUrl = "https://play.google.com/store/apps/details?id=com.nexoapex.anonymizemyid"
  domain = "anonymizemyid.com"

  # Legal entity (Nexo Apex S.L.)
  company = "NEXO APEX S.L."
  brand = "Anonymize my ID"
  vat = "B55467146"
  address = "Edificio Camí Reial, c/ Camí Reial 13-17, 3a planta, 43700 El Vendrell, Tarragona, Spain"
  phone = "+34 659 696 741"
  email = "hi@nexoapex.com"
  privacyEmail = "rgpd@nexoapex.com"
  parentSite = "https://nexoapex.com"

[markup.goldmark.renderer]
  unsafe = true

# Related-content index, used by the "Keep reading" block on guide pages.
# Before this existed the block linked the same first three guides from every
# page, so three guides collected 14 inbound links each and eight collected two.
# Matching on the `keywords` front matter spreads internal link equity (and
# crawl paths) across the whole hub instead.
[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

# Extra machine-readable home-page outputs for GEO / LLMs: /llms.txt,
# /llms-full.txt and /license.xml, alongside the usual HTML + RSS. Generated
# per language.
[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFULL", "RSL"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true

# RSL 1.0 (rslstandard.org) — machine-readable AI licensing terms. Purely
# declarative: robots.txt still says `Allow: /` for every crawler, so anything
# that does not understand RSL behaves exactly as it did before. The terms we
# publish permit search, AI answer use and training, and ask for attribution —
# consistent with a public marketing site that wants to be cited.
[mediaTypes."application/rsl+xml"]
  suffixes = ["xml"]

[outputFormats.RSL]
  mediaType = "application/rsl+xml"
  baseName = "license"
  rel = "license"
