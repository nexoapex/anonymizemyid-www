baseURL = "https://anonymizemyid.com/"
theme = "aegis"
enableRobotsTXT = true
enableInlineShortcodes = true
disableKinds = ["taxonomy", "term"]

# Bilingual: English (default, served at /) and Spanish (served at /es/).
# The browser language is detected client-side and the visitor is redirected to
# their language via the per-page hreflang alternates (see partials/head.html).
defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

# ─────────────────────────────  English  ──────────────────────────────
[languages.en]
  locale = "en-US"
  label = "English"
  title = "Anonymize my ID — share your ID, not your identity"
  weight = 1
  [languages.en.params]
    tagline = "Share your ID, not your identity."
    description = "Photograph an ID card or passport and create a safe, watermarked, redacted copy — processed 100% on your phone. No account, no upload."
    price = "≈ €4"
    priceNote = "one-time · yours for life"
    priceDisclaimer = "Approx. — excludes VAT, varies by region"
    ogImageAlt = "Anonymize my ID — a passport photographed, then redacted and watermarked on-device"
  [languages.en.menus]
    [[languages.en.menus.footer]]
      name = "Guides"
      pageRef = "/guides"
      weight = 5
    [[languages.en.menus.footer]]
      name = "Privacy Policy"
      pageRef = "/privacy"
      weight = 10
    [[languages.en.menus.footer]]
      name = "Legal Notice & Terms"
      pageRef = "/terms"
      weight = 20
    [[languages.en.menus.footer]]
      name = "Imprint"
      pageRef = "/imprint"
      weight = 30
    [[languages.en.menus.footer]]
      name = "About"
      pageRef = "/about"
      weight = 40
    [[languages.en.menus.footer]]
      name = "Contact"
      pageRef = "/contact"
      weight = 50

# ─────────────────────────────  Spanish  ──────────────────────────────
[languages.es]
  locale = "es-ES"
  label = "Español"
  title = "Anonymize my ID — comparte tu documento, no tu identidad"
  weight = 2
  [languages.es.params]
    tagline = "Comparte tu documento, no tu identidad."
    description = "Fotografía tu DNI, NIE o pasaporte y crea una copia segura, con los datos ocultos y marca de agua — procesada 100% en tu móvil. Sin cuenta y sin subir nada."
    price = "≈ 4 €"
    priceNote = "pago único · para siempre"
    priceDisclaimer = "Aprox. — sin IVA, varía según la región"
    ogImageAlt = "Anonymize my ID — un pasaporte fotografiado y después censurado y con marca de agua en el propio dispositivo"
  [languages.es.menus]
    [[languages.es.menus.footer]]
      name = "Guías"
      pageRef = "/guides"
      weight = 5
    [[languages.es.menus.footer]]
      name = "Política de privacidad"
      pageRef = "/privacy"
      weight = 10
    [[languages.es.menus.footer]]
      name = "Aviso legal y condiciones"
      pageRef = "/terms"
      weight = 20
    [[languages.es.menus.footer]]
      name = "Información de la empresa"
      pageRef = "/imprint"
      weight = 30
    [[languages.es.menus.footer]]
      name = "Acerca de"
      pageRef = "/about"
      weight = 40
    [[languages.es.menus.footer]]
      name = "Contacto"
      pageRef = "/contact"
      weight = 50

# ───────────────────────  Shared params (all languages)  ───────────────
[params]
  googleAnalytics = "G-524LZY9KB9"
  appName = "Anonymize my ID"
  freeUses = 2
  # A store badge goes live as soon as its URL is set; leave "#" to keep "Coming soon".
  # The country-less App Store link 301-redirects each visitor to their own
  # storefront (e.g. /us/, /es/), which is what we want for a travel audience.
  appStoreUrl = "https://apps.apple.com/app/id6781656126"
  appStoreId = "6781656126"
  playStoreUrl = "https://play.google.com/store/apps/details?id=com.nexoapex.anonymizemyid"
  domain = "anonymizemyid.com"

  # Legal entity (Nexo Apex S.L.)
  company = "NEXO APEX S.L."
  brand = "Anonymize my ID"
  vat = "B55467146"
  address = "Edificio Camí Reial, c/ Camí Reial 13-17, 3a planta, 43700 El Vendrell, Tarragona, Spain"
  phone = "+34 659 696 741"
  email = "hi@nexoapex.com"
  privacyEmail = "rgpd@nexoapex.com"
  parentSite = "https://nexoapex.com"

[markup.goldmark.renderer]
  unsafe = true

# Related-content index, used by the "Keep reading" block on guide pages.
# Before this existed the block linked the same first three guides from every
# page, so three guides collected 14 inbound links each and eight collected two.
# Matching on the `keywords` front matter spreads internal link equity (and
# crawl paths) across the whole hub instead.
[related]
  threshold = 20
  includeNewer = true
  toLower = true
  [[related.indices]]
    name = "keywords"
    weight = 100
  [[related.indices]]
    name = "date"
    weight = 10

# Extra machine-readable home-page outputs for GEO / LLMs: /llms.txt,
# /llms-full.txt and /license.xml, alongside the usual HTML + RSS. Generated
# per language.
[outputs]
  home = ["HTML", "RSS", "LLMS", "LLMSFULL", "RSL"]

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true

[outputFormats.LLMSFULL]
  mediaType = "text/plain"
  baseName = "llms-full"
  isPlainText = true

# RSL 1.0 (rslstandard.org) — machine-readable AI licensing terms. Purely
# declarative: robots.txt still says `Allow: /` for every crawler, so anything
# that does not understand RSL behaves exactly as it did before. The terms we
# publish permit search, AI answer use and training, and ask for attribution —
# consistent with a public marketing site that wants to be cited.
[mediaTypes."application/rsl+xml"]
  suffixes = ["xml"]

[outputFormats.RSL]
  mediaType = "application/rsl+xml"
  baseName = "license"
  rel = "license"
