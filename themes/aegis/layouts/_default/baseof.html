<!DOCTYPE html>
<html lang="{{ site.Language.Lang | default "en" }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
  {{ partial "header.html" . }}
  <main id="top">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partial "cookie-consent.html" . }}
  {{ $consentJS := resources.Get "js/consent.js" | minify | fingerprint }}
  <script defer src="{{ $consentJS.RelPermalink }}" integrity="{{ $consentJS.Data.Integrity }}"></script>
</body>
</html>
