<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{{- $isHome := .IsHome -}}
<title>{{ if $isHome }}{{ site.Title }}{{ else }}{{ .Title }} · {{ site.Params.appName }}{{ end }}</title>
<meta name="description" content="{{ .Description | default site.Params.description }}">
<link rel="canonical" href="{{ .Permalink }}">

<meta property="og:site_name" content="{{ site.Params.appName }}">
<meta property="og:title" content="{{ if $isHome }}{{ site.Params.appName }} — {{ site.Params.tagline }}{{ else }}{{ .Title }}{{ end }}">
<meta property="og:description" content="{{ .Description | default site.Params.description }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:image" content="{{ "images/og.png" | absURL }}">
<meta name="twitter:card" content="summary_large_image">

<meta name="theme-color" content="#0F1115">
<link rel="icon" href="{{ "images/favicon.svg" | relURL }}" type="image/svg+xml">

{{ $css := resources.Get "css/main.css" | minify | fingerprint }}
<link rel="stylesheet" href="{{ $css.RelPermalink }}" integrity="{{ $css.Data.Integrity }}">
